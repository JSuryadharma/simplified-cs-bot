# Contoh reverse proxy nginx untuk Simplified CS Bot dengan subpath di satu domain.
# Salin blok `location` ke server block HTTPS Anda (mis. yang dikelola Certbot).
#
# Pasangan .env untuk contoh ini:
#   N8N_HOST=bot.example.com
#   N8N_PROTOCOL=https
#   N8N_PATH=/n8n/
#   WEBHOOK_URL=https://bot.example.com/n8n/
#   N8N_EDITOR_BASE_URL=https://bot.example.com/n8n/
#   N8N_PROXY_HOPS=1
#   N8N_SECURE_COOKIE=true
#   N8N_BIND=127.0.0.1          # port 5678 hanya untuk nginx
#   DASHBOARD_BASE_PATH=/wa-dashboard/
#   DASHBOARD_BIND=127.0.0.1
#   COMPOSE_PROFILES=           # tunnel ngrok tidak dipakai
#
# Callback URL Meta: https://bot.example.com/n8n/webhook/whatsapp
#
# Penting: n8n selalu melayani di root port 5678. N8N_PATH hanya mengubah URL yang
# dibuat n8n (aset editor, link webhook), jadi nginx WAJIB membuang prefix /n8n/.
# Itu sebabnya `location` dan `proxy_pass` sama-sama diakhiri "/".

# Header WebSocket (editor n8n memakai /rest/push). Taruh di blok http {} sekali saja.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 443 ssl;
    server_name bot.example.com;
    # ssl_certificate ... / ssl_certificate_key ...  (Certbot)

    # n8n: editor, webhook, form
    location = /n8n { return 301 /n8n/; }
    location /n8n/ {
        proxy_pass http://127.0.0.1:5678/;     # "/" di akhir = buang prefix /n8n/

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;                   # stream respons AI/SSE
        proxy_read_timeout 300s;               # impor knowledge bisa lama
        client_max_body_size 120m;             # upload chat export / gambar
    }

    # Dashboard tiket & order. Dashboard menerima prefix dibuang atau tidak,
    # selama DASHBOARD_BASE_PATH sama dengan subpath di sini.
    location /wa-dashboard/ {
        proxy_pass http://127.0.0.1:4000/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 300s;
        client_max_body_size 120m;

        # Dashboard tidak punya login sendiri: batasi akses, mis. basic auth atau IP.
        # auth_basic "WA Dashboard";
        # auth_basic_user_file /etc/nginx/.htpasswd-wa;
    }

    # PostgREST (3002) dan Qdrant (6333) tidak punya autentikasi: jangan diproxy ke
    # internet. Bila perlu dari luar, pakai SSH tunnel: ssh -L 6333:127.0.0.1:6333 host
}
